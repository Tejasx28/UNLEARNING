[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-unlearning"
version = "0.1.0"
description = "Machine unlearning research framework on TOFU benchmark"
authors = [{ name = "Research Team" }]
dependencies = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "accelerate>=1.3.0",
    "datasets>=3.2.0",
    "evaluate>=0.4.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.6.0",
    "pandas>=2.2.0",
    "matplotlib>=3.10.0",
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "tqdm>=4.67.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
